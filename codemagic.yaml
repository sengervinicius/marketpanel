workflows:
  ios-release:
    name: Particle iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: "26"
      node: "22"
      vars:
        BUNDLE_ID: "com.the-particle.app"
    integrations:
      app_store_connect: CodemagicASCKey
    scripts:
      - name: Install deps & build web
        script: |
          node -v
          cd client && npm ci && npm run build
      - name: Capacitor sync iOS
        script: |
          cd client && npx cap sync ios
      - name: Set up code signing (fetch/create App Store cert + profile)
        script: |
          keychain initialize
          # CI mints a fresh Apple Distribution certificate each run. Apple caps the number
          # of distribution certificates, so revoke existing ones first to always free a slot.
          app-store-connect certificates list --json > /tmp/certs.json 2>/dev/null || echo "[]" > /tmp/certs.json
          for cid in $(python3 -c "import json; print('\n'.join(c.get('id','') for c in json.load(open('/tmp/certs.json')) if 'DISTRIBUTION' in (c.get('attributes') or {}).get('certificateType','')))"); do
            echo "Revoking existing distribution certificate $cid"
            app-store-connect certificates delete "$cid" --ignore-not-found || true
          done
          # App Store Connect needs a signing private key to create the distribution
          # certificate. Use a persisted CERTIFICATE_PRIVATE_KEY if provided; otherwise
          # generate an ephemeral RSA key for this build.
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "No CERTIFICATE_PRIVATE_KEY set - generating an ephemeral RSA key for this build"
            openssl genrsa -out /tmp/cm_cert_key.pem 2048
            export CERTIFICATE_PRIVATE_KEY="$(cat /tmp/cm_cert_key.pem)"
          fi
          app-store-connect fetch-signing-files "com.the-particle.app" \
            --type IOS_APP_STORE \
            --certificate-key="$CERTIFICATE_PRIVATE_KEY" \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Set build number
        script: |
          cd client/ios/App
          agvtool new-version -all $(($BUILD_NUMBER))
      - name: Build IPA
        script: |
          cd client/ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App
          xcode-project build-ipa --project App.xcodeproj --scheme App
    artifacts:
      - client/ios/App/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
