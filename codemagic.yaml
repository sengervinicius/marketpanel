workflows:
  ios-release:
    name: Particle iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: "26"
      node: "22"
      vars:
        BUNDLE_ID: "com.the-particle.app"
    integrations:
      app_store_connect: CodemagicASCKey
    scripts:
      - name: Install deps & build web
        script: |
          node -v
          cd client && npm ci && npm run build
      - name: Capacitor sync iOS
        script: |
          cd client && npx cap sync ios
      - name: Set up code signing (fetch/create App Store cert + profile)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.the-particle.app" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Set build number
        script: |
          cd client/ios/App
          agvtool new-version -all $(($BUILD_NUMBER))
      - name: Build IPA
        script: |
          cd client/ios/App
          xcode-project build-ipa --project App.xcodeproj --scheme App
    artifacts:
      - client/ios/App/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
